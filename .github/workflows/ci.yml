name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests & Neuro-Symbolic Purity Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Run backend test suite
        run: pytest -c backend/pytest.ini backend/tests -q

      - name: Neuro-Symbolic Purity Gate (backend/app/detect)
        run: |
          python - <<'EOF'
          import ast
          import pathlib
          import sys

          FORBIDDEN = {
              "google",
              "genai",
              "openai",
              "anthropic",
              "sqlite3",
              "psycopg",
              "httpx",
              "requests",
              "urllib",
          }

          detect_dir = pathlib.Path("backend/app/detect")
          py_files = sorted(detect_dir.rglob("*.py"))
          if not py_files:
              print(f"ERROR: No Python files found under {detect_dir}", file=sys.stderr)
              sys.exit(1)

          violations = []
          for path in py_files:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          root = alias.name.split(".")[0]
                          if root in FORBIDDEN:
                              violations.append(f"{path}:{node.lineno} imports '{alias.name}'")
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      root = node.module.split(".")[0]
                      if root in FORBIDDEN:
                          violations.append(f"{path}:{node.lineno} imports from '{node.module}'")

          if violations:
              print("Neuro-Symbolic Purity Gate FAILED:", file=sys.stderr)
              for v in violations:
                  print(f"  - {v}", file=sys.stderr)
              sys.exit(1)

          print(f"Neuro-Symbolic Purity Gate PASSED ({len(py_files)} files checked, 0 forbidden imports).")
          EOF

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
